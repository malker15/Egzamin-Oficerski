name: Reset Stage I learning stats

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset learning stats storage version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/Stage1Quiz.tsx')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('const LS_KEY_STATS = "quiz_agent_stats_v2";', 'const LS_KEY_STATS = "quiz_agent_stats_v3";', 1)
          s = s.replace('const LS_KEY_STATS_LEGACY = "quiz_agent_stats_v1";', 'const LS_KEY_STATS_LEGACY = "quiz_agent_stats_v2";', 1)
          s = s.replace('    const saved = localStorage.getItem(LS_KEY_STATS) ?? localStorage.getItem(LS_KEY_STATS_LEGACY);', '    localStorage.removeItem("quiz_agent_stats_v1");\n    localStorage.removeItem("quiz_agent_stats_v2");\n    const saved = localStorage.getItem(LS_KEY_STATS);', 1)
          s = s.replace('<Pill theme={theme}>v13</Pill>', '<Pill theme={theme}>v13.1</Pill>', 1)
          required = [
              'const LS_KEY_STATS = "quiz_agent_stats_v3";',
              'localStorage.removeItem("quiz_agent_stats_v1")',
              'localStorage.removeItem("quiz_agent_stats_v2")',
              'const saved = localStorage.getItem(LS_KEY_STATS);',
              '<Pill theme={theme}>v13.1</Pill>',
          ]
          for x in required:
              if x not in s:
                  raise SystemExit(f'missing expected reset logic: {x}')
          if s == old:
              raise SystemExit('no changes applied')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify reset diff
        run: |
          git diff --check
          grep -q 'quiz_agent_stats_v3' app/Stage1Quiz.tsx
          grep -q 'v13.1' app/Stage1Quiz.tsx
      - name: Commit reset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Stage1Quiz.tsx
          git commit -m "Reset Stage I learning stats for all users"
          git push origin main
