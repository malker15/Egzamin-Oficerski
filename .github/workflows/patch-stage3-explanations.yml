name: Patch Stage III explanations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-stage3-explanations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only explanation fields
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, difflib, json, re, unicodedata, zlib
          from pathlib import Path

          SOURCES = json.loads(zlib.decompress(base64.b64decode("")).decode("utf-8"))

          def norm(s):
              s = unicodedata.normalize("NFKD", s or "")
              s = "".join(ch for ch in s if not unicodedata.combining(ch))
              s = s.lower()
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return " ".join(s.split())

          alias_to_idx = {}
          for idx, src in enumerate(SOURCES):
              alias_to_idx[norm(src["heading"])] = idx
          for idx, src in enumerate(SOURCES):
              a = norm(src.get("opening", ""))
              if a and a not in alias_to_idx:
                  alias_to_idx[a] = idx

          topic_files = sorted(Path("public/stage3").glob("topics_*.json"))
          loaded = []
          for path in topic_files:
              data = json.loads(path.read_text(encoding="utf-8"))
              loaded.append([path, data])

          matches = []
          used_sources = set()
          for path, data in loaded:
              for topic in data:
                  nt = norm(topic.get("title", ""))
                  src_idx = alias_to_idx.get(nt)
                  method = "exact"
                  score = 1.0
                  if src_idx is None:
                      scored = sorted(
                          ((difflib.SequenceMatcher(None, nt, alias).ratio(), idx, alias)
                           for alias, idx in alias_to_idx.items()),
                          reverse=True,
                      )
                      best = scored[0]
                      second = scored[1] if len(scored) > 1 else (0.0, -1, "")
                      if best[0] >= 0.88 and best[0] - second[0] >= 0.05:
                          score, src_idx = best[0], best[1]
                          method = "fuzzy"
                  if src_idx is None:
                      continue
                  if src_idx in used_sources:
                      raise SystemExit(f"Source matched twice: {SOURCES[src_idx]['heading']}")
                  used_sources.add(src_idx)
                  matches.append((path, topic, src_idx, method, score))

          if len(matches) != 20 or len(used_sources) != 20:
              print(f"Matched {len(matches)} topics / {len(used_sources)} source documents; expected 20.")
              for path, topic, idx, method, score in matches:
                  print(f"MATCHED {topic['title']} <- {SOURCES[idx]['heading']} ({method} {score:.3f})")
              missing = [s["heading"] for i, s in enumerate(SOURCES) if i not in used_sources]
              print("Missing sources:", missing)
              raise SystemExit(2)

          changed_paths = set()
          for path, topic, idx, method, score in matches:
              src = SOURCES[idx]
              old = topic.get("explanation")
              new = src["explanation"]
              if old != new:
                  topic["explanation"] = new
                  changed_paths.add(path)
              print(f"MATCH {topic['title']} <- {src['heading']} ({method} {score:.3f}) changed={old != new}")

          for path, data in loaded:
              if path in changed_paths:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(f"Changed files: {len(changed_paths)} -> {', '.join(str(p) for p in sorted(changed_paths))}")
          PYCODE

          git diff --check
          git diff --stat
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stage3/topics_*.json
          git commit -m "Update Stage III explanations from source ZIP"
          git push
