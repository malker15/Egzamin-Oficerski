name: Stage3 topic03 fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage3-topic03-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "import base64,gzip,pathlib; pathlib.Path('public/stage3/topics_03.json').write_bytes(gzip.decompress(base64.b64decode('')))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stage3/topics_03.json
          git commit -m "Podmień scenariusze Etapu III z ZIP (2a/4)"
          git push
