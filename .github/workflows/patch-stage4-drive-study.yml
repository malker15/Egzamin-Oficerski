name: Patch Stage4 Drive study materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stage4-drive-study.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Stage4 page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/stage4/page.tsx')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit('Missing pattern:\n' + old)
              s = s.replace(old, new, count)

          rep('} from "./data";\n', '} from "./data";\nimport { Stage4ShootingExtra, Stage4StudyPanel } from "./Stage4StudyPanel";\nimport { hasStage4StudyMaterial } from "./driveStudyMaterials";\n')

          rep('<Badge>Źródło: plan egzaminu 2025</Badge>', '<Badge>Źródła: plan egzaminu + materiały 2026</Badge>')

          rep('''            <Card className="border-dashed bg-neutral-900/45">''', '''            <Stage4ShootingExtra />\n\n            <Card className="border-dashed bg-neutral-900/45">''')

          old_info = '''Nie dopisujemy procedur, których nie ma w planie egzaminu. Tam, gdzie dokument wymaga np. pełnej procedury 5-25 / 5xC, meldunku CFF, szczegółów OPBMR albo MEDEVAC, aplikacja zaznacza brak źródła. Gdy dodamy właściwe materiały szkoleniowe, uzupełnimy dokładne sekwencje bez zgadywania.'''
          new_info = '''Procedury 5-25 / 5xC, CFF, OPBMR, ewakuacja rannego, zaopatrzenie i OKD zostały uzupełnione na podstawie materiałów szkoleniowych z udostępnionych folderów. Przy stacji najpierw uczysz się krótkiego schematu, a niżej nadal masz wzorzec dowodzenia i checklistę egzaminacyjną.'''
          rep(old_info, new_info)

          rep('''            </Card>\n\n            {station.changeOfSituation && <Card className="border-amber-900/40 bg-amber-950/10">''', '''            </Card>\n\n            <Stage4StudyPanel stationId={station.id} />\n\n            {station.changeOfSituation && <Card className="border-amber-900/40 bg-amber-950/10">''')

          s = s.replace('{station.sourceGap && <Card', '{station.sourceGap && !hasStage4StudyMaterial(station.id) && <Card')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/stage4/page.tsx
          git commit -m "Podłącz materiały szkoleniowe do Etapu IV"
          git push
