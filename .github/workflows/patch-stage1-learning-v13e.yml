name: Patch Stage I learning v13e

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-stage1-learning-v13e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepatch whitespace-sensitive UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/Stage1Quiz.tsx')
          text = p.read_text(encoding='utf-8')

          summary = re.compile(
              r'[ \t]*<Pill theme=\{theme\}>\n'
              r'[ \t]*Opanowane: <span className="ml-1 font-semibold">\{progressSummary\.mastered\}</span>\n'
              r'[ \t]*</Pill>\n\n'
              r'[ \t]*<Pill theme=\{theme\}>\n'
              r'[ \t]*Do poprawy: <span className="ml-1 font-semibold">\{progressSummary\.needsWork\}</span>\n'
              r'[ \t]*</Pill>'
          )
          summary_repl = '''            <Pill theme={theme}>
              Nowe: <span className="ml-1 font-semibold">{progressSummary.unseen}</span>
            </Pill>

            <Pill theme={theme}>
              W nauce: <span className="ml-1 font-semibold">{progressSummary.learning}</span>
            </Pill>

            <Pill theme={theme}>
              Opanowane: <span className="ml-1 font-semibold">{progressSummary.mastered}</span>
            </Pill>'''
          text, count = summary.subn(summary_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'summary prepatch: expected 1, got {count}')

          status = re.compile(
              r'[ \t]*<div className="flex flex-wrap items-center justify-between gap-3">\n'
              r'[ \t]*<div className="text-sm font-semibold">\{progressLabel\}</div>\n'
              r'[ \t]*<Pill theme=\{theme\}>\{progress\}%</Pill>\n'
              r'[ \t]*</div>'
          )
          status_repl = '''              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="text-sm font-semibold">{progressLabel}</div>
                <div className="flex flex-wrap items-center gap-2">
                  {state.mode === "study" && <Pill theme={theme}>{currentStudyStatus}</Pill>}
                  <Pill theme={theme}>{progress}%</Pill>
                </div>
              </div>'''
          text, count = status.subn(status_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'status prepatch: expected 1, got {count}')

          p.write_text(text, encoding='utf-8')
          print('UI prepatch OK')
          PY

      - name: Run core Stage I v13 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap, subprocess

          src = Path('.github/workflows/patch-stage1-learning-v13c.yml').read_text(encoding='utf-8')
          m = re.search(r"          python - <<'PYCODE'\n(.*?)\n          PYCODE", src, re.S)
          if not m:
              raise SystemExit('Could not extract v13c core patch')
          script = textwrap.dedent(m.group(1))

          # UI was already patched above; remove the two brittle UI replacements from the core script.
          for marker, label in [
              ("replace_once('''            <Pill theme={theme}>", 'summary pills'),
              ("replace_once('''              <div className=\"flex flex-wrap items-center justify-between gap-3\">", 'quiz status'),
          ]:
              s = script.index(marker)
              ending = "'" + label + "')"
              e = script.index(ending, s) + len(ending)
              script = script[:s] + "pass  # " + label + " already prepatched" + script[e:]

          Path('/tmp/core_patch.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/core_patch.py'], check=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
        run: npm run build

      - name: Commit Stage I v13
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Stage1Quiz.tsx
          git diff --cached --check
          git commit -m "Improve Stage I learning algorithm v13"
          git push
