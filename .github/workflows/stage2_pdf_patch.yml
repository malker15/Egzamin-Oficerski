name: Patch Stage II PDF sets

on:
  push:
    paths:
      - ".github/workflows/stage2_pdf_patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Stage II page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("app/stage2/page.tsx")
          s=p.read_text(encoding="utf-8")

          old='import { STAGE2_SET_DEFINITIONS } from "./setDefinitions";'
          new='import { STAGE2_SET_DEFINITIONS, type Stage2SetQuestionSpec } from "./setDefinitions";\nimport { STAGE2_PDF_ANSWER_OVERRIDES } from "./pdfSetAnswerOverrides";'
          assert old in s
          s=s.replace(old,new,1)

          pattern=re.compile(r'function resolveSetQuestion\(anchor:string, data:Data\):ResolvedSetQuestion \{.*?\n\}\n\nfunction buildResolvedSets\(data:Data\):ResolvedSet\[\]\{.*?\n\}\n',re.S)
          replacement='''function resolveSetQuestion(spec:Stage2SetQuestionSpec, data:Data):ResolvedSetQuestion {
            const pool:{kind:"theory"|"practical";q:Theory|Practical}[]=[
              ...data.theory.map(q=>({kind:"theory" as const,q})),
              ...data.practical.map(q=>({kind:"practical" as const,q})),
            ];
            let best:typeof pool[number]|null=null;
            let bestScore=0;
            for(const item of pool){
              const score=matchScore(spec.anchor,item.q.question);
              if(score>bestScore){bestScore=score;best=item;}
            }
            if(bestScore<55||!best) return null;
            const override=spec.answerKey ? STAGE2_PDF_ANSWER_OVERRIDES[spec.answerKey] : undefined;
            const q={...best.q,...(override??{}),id:`PDF_${normalizeText(spec.text)}`,question:spec.text,activeForRandomization:true} as Theory|Practical;
            return {kind:best.kind,q};
          }

          function buildResolvedSets(data:Data):ResolvedSet[]{
            return STAGE2_SET_DEFINITIONS.map(def=>({
              number:def.number,
              questions:[
                resolveSetQuestion(def.questions[0],data),
                resolveSetQuestion(def.questions[1],data),
              ],
            }));
          }
          '''
          s,n=pattern.subn(replacement,s,count=1)
          assert n==1, f"resolver={n}"

          old='  const [mockPractical,setMockPractical]=useState<Practical|null>(null);\n'
          assert old in s
          s=s.replace(old,'',1)

          old='''  const activeTheory=useMemo(()=>data?.theory.filter(q=>q.activeForRandomization)??[],[data]);
          const activePractical=useMemo(()=>data?.practical.filter(q=>q.activeForRandomization)??[],[data]);
          const resolvedSets=useMemo(()=>data?buildResolvedSets(data):[],[data]);'''
          new='''  const resolvedSets=useMemo(()=>data?buildResolvedSets(data):[],[data]);
          const officialQuestions=useMemo(()=>{
            const byId=new Map<string,{kind:"theory"|"practical";q:Theory|Practical}>();
            for(const set of resolvedSets) for(const item of set.questions) if(item) byId.set(item.q.id,item);
            return [...byId.values()];
          },[resolvedSets]);
          const activeTheory=useMemo(()=>officialQuestions.filter(item=>item.kind==="theory").map(item=>item.q as Theory),[officialQuestions]);
          const activePractical=useMemo(()=>officialQuestions.filter(item=>item.kind==="practical").map(item=>item.q as Practical),[officialQuestions]);'''
          assert old in s
          s=s.replace(old,new,1)

          pattern=re.compile(r'  function startMock\(\)\{.*?\n  \}\n  function mockNext\(\)\{.*?\n  \}',re.S)
          replacement='''  function startMock(){
            const chosen=randomCompleteSet();
            if(!chosen)return;
            setMockSet(chosen);
            setMockIndex(0);
            setView("mock");
            setRevealed(false);setFull(false);setChecked({});
          }
          function mockNext(){
            if(!mockSet)return;
            if(mockIndex===0){
              setMockIndex(1);setRevealed(false);setFull(false);setChecked({});
            }else{
              setView("home");setMockSet(null);setMockIndex(0);
            }
          }'''
          s,n=pattern.subn(replacement,s,count=1)
          assert n==1, f"mock={n}"

          old='  const mockCurrent=mockIndex<2 ? (mockSet?.questions[mockIndex] ?? null) : (mockPractical ? {kind:"practical" as const,q:mockPractical} : null);'
          assert old in s
          s=s.replace(old,'  const mockCurrent=mockSet?.questions[mockIndex] ?? null;',1)

          repl={
            'Nauka teorii — zestawy':'Nauka — zestawy 1–40',
            'Losujesz dokładnie zestaw nr 1–34 → pytanie 1 → pytanie 2 → samoocena.':'Losujesz dokładnie zestaw nr 1–40 → pytanie 1 → pytanie 2 → samoocena.',
            '{data.counts.practicalActive} aktywne':'{activePractical.length} z zestawów',
            '2 teoria z zestawu + 1 praktyka':'2 pytania z jednego zestawu',
            'Losujesz jeden z rzeczywistych zestawów 1–34, a po jego dwóch pytaniach jedno losowe zadanie praktyczne.':'Losujesz jeden z rzeczywistych zestawów 1–40 i odpowiadasz kolejno na jego dwa pytania.',
            'BAZA // ZESTAWY 1–34':'BAZA // ZESTAWY 1–40',
            'Otwórz dowolny numer i zobacz oba pytania wraz z odpowiedziami z obecnej bazy Etapu II.':'Otwórz dowolny numer i zobacz oba pytania wraz z odpowiedziami zgodnymi z arkuszem „Zestawy pytań 1–40”.',
            'Otwórz 34 zestawy →':'Otwórz 40 zestawów →',
            '<span>{mockIndex<2?`Teoria ${mockIndex+1} / 2`:"Praktyka 1 / 1"}</span>':'<span>{`Pytanie ${mockIndex+1} / 2`}</span>',
            'setPosition={mockIndex<2?mockIndex+1:undefined}':'setPosition={mockIndex+1}',
            '{mockIndex===0?"Następne pytanie z zestawu":mockIndex===1?"Przejdź do zadania praktycznego":"Zakończ symulację"}':'{mockIndex===0?"Następne pytanie z zestawu":"Zakończ symulację"}',
          }
          for a,b in repl.items():
            assert a in s, a
            s=s.replace(a,b)

          assert 'data?.theory.filter(q=>q.activeForRandomization)' not in s
          assert 'data?.practical.filter(q=>q.activeForRandomization)' not in s
          assert 'mockPractical' not in s
          assert '1–34' not in s

          p.write_text(s,encoding="utf-8")
          print("page patch OK")
          PY

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/stage2/page.tsx
          git commit -m "Use only official Stage II PDF sets"
          git push
