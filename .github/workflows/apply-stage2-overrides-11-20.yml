name: Apply Stage2 overrides 11-20

on:
  push:
    branches: [main]
    paths:
      - 'app/stage2/answerOverrides11to20.ts'
      - '.github/workflows/apply-stage2-overrides-11-20.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Stage II loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/stage2/page.tsx')
          text = path.read_text()

          import_line = 'import { STAGE2_ANSWER_OVERRIDES } from "./answerOverrides";\n'
          import_new = 'import { STAGE2_ANSWER_OVERRIDES_11_20 } from "./answerOverrides11to20";\n'
          if import_new not in text:
              if import_line not in text:
                  raise SystemExit('Nie znaleziono importu answerOverrides')
              text = text.replace(import_line, import_line + import_new, 1)

          old_theory = 'loaded.theory=loaded.theory.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{})}));'
          new_theory = 'loaded.theory=loaded.theory.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_11_20[q.id]??{})}));'
          old_practical = 'loaded.practical=loaded.practical.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{})}));'
          new_practical = 'loaded.practical=loaded.practical.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_11_20[q.id]??{})}));'
          if 'STAGE2_ANSWER_OVERRIDES_11_20[q.id]' not in text:
              if old_theory not in text or old_practical not in text:
                  raise SystemExit('Nie znaleziono mapowania override')
              text = text.replace(old_theory, new_theory, 1).replace(old_practical, new_practical, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-stage2-overrides-11-20.yml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/stage2/page.tsx .github/workflows/apply-stage2-overrides-11-20.yml
          git commit -m 'Włącz poprawione odpowiedzi zestawów 11-20'
          git push
