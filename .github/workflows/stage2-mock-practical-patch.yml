name: Patch Stage2 mock practical

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-mock-practical-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/stage2/page.tsx')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('Missing pattern:\n'+old)
              s=s.replace(old,new,1)

          rep('import { STAGE2_ANSWER_OVERRIDES_21_34 } from "./answerOverrides21to34";\n',
              'import { STAGE2_ANSWER_OVERRIDES_21_34 } from "./answerOverrides21to34";\nimport { STAGE2_PRACTICAL_OVERRIDES } from "./practicalOverrides";\n')

          rep('loaded.practical=loaded.practical.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_11_20[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_21_34[q.id]??{})}));',
              'loaded.practical=loaded.practical.map(q=>({...q,...(STAGE2_ANSWER_OVERRIDES[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_11_20[q.id]??{}),...(STAGE2_ANSWER_OVERRIDES_21_34[q.id]??{}),...(STAGE2_PRACTICAL_OVERRIDES[q.id]??{})}));')

          rep('  const [mockIndex,setMockIndex]=useState(0);\n',
              '  const [mockIndex,setMockIndex]=useState(0);\n  const [mockPractical,setMockPractical]=useState<Practical|null>(null);\n')

          rep('''  function startMock(){
    const chosen=randomCompleteSet();
    if(!chosen)return;
    setMockSet(chosen);
    setMockIndex(0);
    setView("mock");
    setRevealed(false);setFull(false);setChecked({});
  }
''','''  function startMock(){
    const chosen=randomCompleteSet();
    const practical=activePractical[Math.floor(Math.random()*activePractical.length)] ?? null;
    if(!chosen||!practical)return;
    setMockSet(chosen);
    setMockPractical(practical);
    setMockIndex(0);
    setView("mock");
    setRevealed(false);setFull(false);setChecked({});
  }
''')

          rep('''  function mockNext(){
    if(!mockSet)return;
    if(mockIndex===0){
      setMockIndex(1);setRevealed(false);setFull(false);setChecked({});
    }else{
      setView("home");setMockSet(null);setMockIndex(0);
    }
  }
''','''  function mockNext(){
    if(!mockSet)return;
    if(mockIndex<2){
      setMockIndex(i=>i+1);setRevealed(false);setFull(false);setChecked({});
    }else{
      setView("home");setMockSet(null);setMockPractical(null);setMockIndex(0);
    }
  }
''')

          rep('''          <div className="text-sm text-neutral-600">1 zestaw = 2 przypisane pytania</div>
          <div className="mt-2 text-xl font-bold">Symulacja Etapu II</div>
          <p className="mt-2 text-sm text-neutral-600">Losujesz jeden z rzeczywistych zestawów 1–34. Numer zestawu jest widoczny przez całą symulację.</p>
''','''          <div className="text-sm text-neutral-600">2 teoria z zestawu + 1 praktyka</div>
          <div className="mt-2 text-xl font-bold">Symulacja Etapu II</div>
          <p className="mt-2 text-sm text-neutral-600">Losujesz jeden z rzeczywistych zestawów 1–34, a po jego dwóch pytaniach jedno losowe zadanie praktyczne.</p>
''')

          rep('  const mockCurrent=mockSet?.questions[mockIndex] ?? null;\n',
              '  const mockCurrent=mockIndex<2 ? (mockSet?.questions[mockIndex] ?? null) : (mockPractical ? {kind:"practical" as const,q:mockPractical} : null);\n')

          rep('''    {view==="mock"&&mockSet&&mockCurrent&&<div className="space-y-4"><div className="flex items-center justify-between gap-3 text-sm text-neutral-400"><span>Symulacja Etapu II • zestaw nr <b className="text-white">{mockSet.number}</b></span><span>Pytanie {mockIndex+1} / 2</span></div><QuestionView q={mockCurrent.q} kind={mockCurrent.kind} exam setNumber={mockSet.number} setPosition={mockIndex+1}/>{revealed&&<div className="flex justify-end"><Btn onClick={mockNext}>{mockIndex===0?"Następne pytanie z zestawu":"Zakończ symulację"}</Btn></div>}</div>}
''','''    {view==="mock"&&mockSet&&mockCurrent&&<div className="space-y-4"><div className="flex items-center justify-between gap-3 text-sm text-neutral-400"><span>Symulacja Etapu II • zestaw nr <b className="text-white">{mockSet.number}</b></span><span>{mockIndex<2?`Teoria ${mockIndex+1} / 2`:"Praktyka 1 / 1"}</span></div><QuestionView q={mockCurrent.q} kind={mockCurrent.kind} exam setNumber={mockSet.number} setPosition={mockIndex<2?mockIndex+1:undefined}/>{revealed&&<div className="flex justify-end"><Btn onClick={mockNext}>{mockIndex===0?"Następne pytanie z zestawu":mockIndex===1?"Przejdź do zadania praktycznego":"Zakończ symulację"}</Btn></div>}</div>}
''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/stage2/page.tsx
          git commit -m "Dodaj pytanie praktyczne do symulacji Etapu II"
          git push
