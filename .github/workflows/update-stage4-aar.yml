name: Update Stage4 AAR and simplify station view

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stage4-aar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Stage4
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/stage4/page.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'import { Stage4ShootingExtra, Stage4StudyPanel } from "./Stage4StudyPanel";\n',
              'import { Stage4ShootingExtra, Stage4StudyPanel } from "./Stage4StudyPanel";\nimport Stage4AARPanel from "./Stage4AARPanel";\n'
          )

          s = s.replace(
              'Przy stacji najpierw uczysz się krótkiego schematu, a niżej nadal masz wzorzec dowodzenia i checklistę egzaminacyjną.',
              'Przy stacji najpierw uczysz się krótkiego schematu z materiałów, a po nim masz prosty AAR do przeprowadzenia po wykonaniu zadania.'
          )

          old_buttons = '<div className="mt-5 flex flex-wrap gap-2"><Button onClick={startPractice}>Trening bez podpowiedzi</Button><Button secondary onClick={() => document.getElementById("wzorzec")?.scrollIntoView({ behavior: "smooth" })}>Pokaż wzorzec wykonania</Button></div>'
          new_buttons = '<div className="mt-5 flex flex-wrap gap-2"><Button onClick={startPractice}>Trening bez podpowiedzi</Button></div>'
          if old_buttons not in s:
              raise SystemExit('Station buttons pattern not found')
          s = s.replace(old_buttons, new_buttons, 1)

          s = s.replace(
              '            <Stage4StudyPanel stationId={station.id} />\n',
              '            <Stage4StudyPanel stationId={station.id} />\n\n            <Stage4AARPanel />\n',
              1
          )

          start = s.find('            <section id="wzorzec"')
          if start == -1:
              raise SystemExit('Wzorzec section start not found')
          end_marker = '            </section>\n\n'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('Wzorzec section end not found')
          s = s[:start] + s[end + len(end_marker):]

          s = s.replace('Nie zaglądaj do wzorca.', 'Nie zaglądaj do materiałów pomocniczych.')
          s = s.replace('Wróć do wzorca', 'Wróć do stacji')

          p.write_text(s, encoding='utf-8')

          v = Path('components/TrainingVideoGuide.tsx')
          t = v.read_text(encoding='utf-8')
          t = re.sub(r'\nconst aar: VideoItem = \{.*?\n\};\n', '\n', t, flags=re.S)
          t = re.sub(r'\n\s*aar,', '', t)
          v.write_text(t, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/stage4/page.tsx components/TrainingVideoGuide.tsx
          git commit -m "Uprość Etap IV i zastąp filmy AAR schematem" || exit 0
          git push
