name: Stage3 ZIP data 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage3-zip-data-4.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY2'
          import base64,gzip
          from pathlib import Path
          blobs={'topics_07.json': '', 'topics_08.json': ''}
          for name,b64 in blobs.items():
              Path('public/stage3',name).write_bytes(gzip.decompress(base64.b64decode(b64)))
          PY2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stage3
          git commit -m "Podmień scenariusze Etapu III z ZIP (4/4)"
          git push
