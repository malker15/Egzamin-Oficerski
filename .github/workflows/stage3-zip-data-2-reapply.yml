name: Stage3 ZIP data 2 reapply
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage3-zip-data-2-reapply.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          awk '/python - <<'"'"'PY2'"'"'/{flag=1; next} /^          PY2$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/stage3-zip-data-2.yml > /tmp/reapply.py
          python /tmp/reapply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stage3/topics_03.json public/stage3/topics_04.json
          git commit -m "Podmień scenariusze Etapu III z ZIP (2/4)"
          git push
