name: Fix Stage I patch matcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-stage1-workflow-indent.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix matcher indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-stage1-learning-v13.yml')
          s = p.read_text(encoding='utf-8')
          old = "replace_once('''.filter((x) => x.wrongCount > 0)"
          new = "replace_once('''      .filter((x) => x.wrongCount > 0)"
          if s.count(old) != 1:
              raise SystemExit(f'expected matcher once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-stage1-learning-v13.yml
          git commit -m "Fix Stage I patch matcher"
          git push
