name: Fix Stage II theory-practice split

on:
  push:
    paths:
      - ".github/workflows/fix_stage2_theory_practice_split.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore practical pool and 3-question exam
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("app/stage2/page.tsx")
          s=p.read_text(encoding="utf-8")

          s=s.replace(
            'type ResolvedSetQuestion = { kind:"theory"|"practical"; q:Theory|Practical } | null;',
            'type ResolvedSetQuestion = { kind:"theory"; q:Theory } | null;'
          )

          pattern=re.compile(r'function resolveSetQuestion\(spec:Stage2SetQuestionSpec, data:Data\):ResolvedSetQuestion \{.*?\n\}\n\nfunction buildResolvedSets',re.S)
          replacement='''function resolveSetQuestion(spec:Stage2SetQuestionSpec, data:Data):ResolvedSetQuestion {
            const pool:(Theory|Practical)[]=[...data.theory,...data.practical];
            let best:Theory|Practical|null=null;
            let bestScore=0;
            for(const item of pool){
              const score=matchScore(spec.anchor,item.question);
              if(score>bestScore){bestScore=score;best=item;}
            }
            if(bestScore<55||!best) return null;
            const override=spec.answerKey ? STAGE2_PDF_ANSWER_OVERRIDES[spec.answerKey] : undefined;
            const baseKeyPoints = "keyPoints" in best
              ? best.keyPoints
              : [best.openingCue,...best.steps,...best.checklist.map(x=>x.text)].filter(Boolean);
            const q:Theory={
              id:`PDF_${normalizeText(spec.text)}`,
              category:override?.category ?? best.category,
              question:spec.text,
              keyPoints:override?.keyPoints ?? baseKeyPoints,
              fullAnswer:override?.fullAnswer ?? best.fullAnswer,
              activeForRandomization:true,
            };
            return {kind:"theory",q};
          }

          function buildResolvedSets'''
          s,n=pattern.subn(replacement,s,count=1)
          assert n==1, f"resolver replacement={n}"

          old='''  const resolvedSets=useMemo(()=>data?buildResolvedSets(data):[],[data]);
          const officialQuestions=useMemo(()=>{
            const byId=new Map<string,{kind:"theory"|"practical";q:Theory|Practical}>();
            for(const set of resolvedSets) for(const item of set.questions) if(item) byId.set(item.q.id,item);
            return [...byId.values()];
          },[resolvedSets]);
          const activeTheory=useMemo(()=>officialQuestions.filter(item=>item.kind==="theory").map(item=>item.q as Theory),[officialQuestions]);
          const activePractical=useMemo(()=>officialQuestions.filter(item=>item.kind==="practical").map(item=>item.q as Practical),[officialQuestions]);'''
          new='''  const resolvedSets=useMemo(()=>data?buildResolvedSets(data):[],[data]);
          const activeTheory=useMemo(()=>{
            const byId=new Map<string,Theory>();
            for(const set of resolvedSets) for(const item of set.questions) if(item) byId.set(item.q.id,item.q);
            return [...byId.values()];
          },[resolvedSets]);
          const activePractical=useMemo(()=>data?.practical.filter(q=>q.activeForRandomization)??[],[data]);'''
          assert old in s, "official pool block not found"
          s=s.replace(old,new,1)

          old='  const [mockIndex,setMockIndex]=useState(0);'
          new='  const [mockIndex,setMockIndex]=useState(0);\n  const [mockPractical,setMockPractical]=useState<Practical|null>(null);'
          assert old in s
          s=s.replace(old,new,1)

          pattern=re.compile(r'  function startMock\(\)\{.*?\n\}\nfunction mockNext\(\)\{.*?\n\}',re.S)
          replacement='''  function startMock(){
            const chosen=randomCompleteSet();
            const practical=pickWeighted(activePractical,progress);
            if(!chosen||!practical)return;
            setMockSet(chosen);
            setMockPractical(practical);
            setMockIndex(0);
            setView("mock");
            setRevealed(false);setFull(false);setChecked({});
          }
          function mockNext(){
            if(!mockSet)return;
            if(mockIndex<2){
              setMockIndex(mockIndex+1);setRevealed(false);setFull(false);setChecked({});
            }else{
              setView("home");setMockSet(null);setMockPractical(null);setMockIndex(0);
            }
          }'''
          s,n=pattern.subn(replacement,s,count=1)
          assert n==1, f"mock functions={n}"

          old='  const mockCurrent=mockSet?.questions[mockIndex] ?? null;'
          new='  const mockCurrent=mockIndex<2 ? (mockSet?.questions[mockIndex] ?? null) : (mockPractical ? {kind:"practical" as const,q:mockPractical} : null);'
          assert old in s
          s=s.replace(old,new,1)

          replacements={
            '{activePractical.length} z zestawów':'{activePractical.length} aktywne',
            '2 pytania z jednego zestawu':'2 teoria z zestawu + 1 praktyka',
            'Losujesz jeden z rzeczywistych zestawów 1–40 i odpowiadasz kolejno na jego dwa pytania.':'Losujesz jeden z rzeczywistych zestawów 1–40, odpowiadasz na jego dwa pytania teoretyczne, a następnie na jedno losowe zadanie praktyczne.',
            '<span>{`Pytanie ${mockIndex+1} / 2`}</span>':'<span>{mockIndex<2?`Teoria ${mockIndex+1} / 2`:"Praktyka 1 / 1"}</span>',
            '<QuestionView q={mockCurrent.q} kind={mockCurrent.kind} exam setNumber={mockSet.number} setPosition={mockIndex+1}/>':'<QuestionView q={mockCurrent.q} kind={mockCurrent.kind} exam setNumber={mockIndex<2?mockSet.number:undefined} setPosition={mockIndex<2?mockIndex+1:undefined}/>',
            '{mockIndex===0?"Następne pytanie z zestawu":"Zakończ symulację"}':'{mockIndex===0?"Następne pytanie z zestawu":mockIndex===1?"Przejdź do zadania praktycznego":"Zakończ symulację"}',
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b,1)

          # Zestawy z PDF są zawsze teorią; praktyka pozostaje osobną starą bazą.
          assert 'const activePractical=useMemo(()=>data?.practical.filter(q=>q.activeForRandomization)??[],[data]);' in s
          assert 'return {kind:"theory",q};' in s
          assert 'setMockPractical(practical);' in s
          assert 'Praktyka 1 / 1' in s

          p.write_text(s,encoding="utf-8")
          print("Stage II split fixed")
          PY

      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/stage2/page.tsx
          git commit -m "Restore Stage II practical pool and 3-question exam"
          git push
