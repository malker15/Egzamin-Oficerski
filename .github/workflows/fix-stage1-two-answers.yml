name: Fix two Stage1 answers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stage1-two-answers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct answer keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/questions.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          fixes = {
              '21': ('W czasie realizacji procesu dowodzenia mogą być organizowane następujące odprawy:', 'C'),
              '282': ('Do indywidualnych środków ochrony przed skażeniami nie zaliczamy:', 'A'),
          }

          found = set()
          for q in data:
              qid = str(q.get('id'))
              if qid in fixes:
                  expected_text, correct_key = fixes[qid]
                  if q.get('question') != expected_text:
                      raise SystemExit(f'Question text mismatch for id {qid}: {q.get("question")!r}')
                  q['correctKey'] = correct_key
                  found.add(qid)

          if found != set(fixes):
              raise SystemExit(f'Missing question ids: {set(fixes)-found}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/questions.json
          git commit -m "Popraw odpowiedzi pytań 21 i 282 Etapu I"
          git push
